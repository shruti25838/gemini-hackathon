# The Studio's own pytest configuration.
#
# This file exists so the suite has a rootdir of its own. Both this project
# and the project above it ship a top-level package called "backend", and the
# root pyproject.toml puts the repository root on sys.path. Without a config
# file here, pytest walks up, finds that one, and "from backend.app import
# create_app" resolves to the wrong backend. Every test module then fails to
# import on a missing pydantic_settings.
#
# With this file, rootdir is ethyneon-studio/ and pythonpath is this folder,
# so "backend" means the Studio's backend. Run it from this folder:
#
#   .venv/Scripts/python -m pytest        # Windows
#   .venv/bin/python -m pytest            # macOS, Linux
[pytest]
minversion = 8.0
testpaths = tests
pythonpath = .
addopts = -q --strict-markers --strict-config
